[project]
name = "logwatch-anomaly-engine"
version = "0.1.0"
requires-python = ">=3.11"
description = "LogWatch ML microservice for log anomaly detection"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "redis>=5.0.0",
    "clickhouse-connect>=0.8.0",
    "psycopg2-binary>=2.9.0",
    "scikit-learn>=1.5.0",
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
]

[project.scripts]
serve = "src.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A"]
ignore = ["ANN101", "ANN102"]
